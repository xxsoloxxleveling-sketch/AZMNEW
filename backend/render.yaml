services:
  - type: web
    name: AZMNEW
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        value: azm-aio-production-jwt-access-secret-2026-v1
      - key: JWT_REFRESH_SECRET
        value: azm-aio-production-jwt-refresh-secret-2026-v1
      - key: QR_SECRET
        value: azm-aio-production-qr-biometric-secret-2026-v1
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: FRONTEND_URL
        sync: false

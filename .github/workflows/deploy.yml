name: Build and Deploy Frontend to Deploy Branch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build
        env:
          # Empty override uses the same-origin Oracle API in production.
          VITE_API_URL: ''

      - name: Build AZM Study Notes
        run: npm run build:notes

      - name: Build staff-only ExamScan PWA
        run: node apps/examscan/scripts/build.mjs

      # Download a pinned, SHA-256 verified QA APK from the immutable GitHub prerelease.
      # The file is explicitly labeled BETA; do not silently substitute a newer build.
      - name: Fetch verified ExamScan Android beta APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p examscan-android-release
          gh release download examscan-v1.1-beta \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ExamScan-Android-Beta-v1.1.apk' \
            --dir examscan-android-release
          echo '5c74ecf1dbfb8f41cbac790fa6130863ad9b1f8b37ceca015cc980a5b697cc13  examscan-android-release/ExamScan-Android-Beta-v1.1.apk' | sha256sum --check

      - name: Combine sites for Oracle
        run: |
          mkdir -p deploy-output/notes deploy-output/examscan deploy-output/downloads
          cp -R dist/. deploy-output/
          cp -R dist-notes/. deploy-output/notes/
          cp -R apps/examscan/dist/. deploy-output/examscan/
          cp examscan-android-release/ExamScan-Android-Beta-v1.1.apk deploy-output/downloads/
          (cd deploy-output/downloads && sha256sum ExamScan-Android-Beta-v1.1.apk > ExamScan-Android-Beta-v1.1.apk.sha256)
          test -s deploy-output/downloads/ExamScan-Android-Beta-v1.1.apk
          printf '%s\n' "$GITHUB_SHA" > deploy-output/deployment-version.txt

      - name: Publish built files to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./deploy-output
          # Connected hosting can pull successive deployments without rewritten history.
          force_orphan: false
          allow_empty_commit: true

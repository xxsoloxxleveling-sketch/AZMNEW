name: Build and Deploy Frontend to Deploy Branch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build
        env:
          # Empty override uses the same-origin Oracle API in production.
          VITE_API_URL: ''

      - name: Build AZM Study Notes
        run: npm run build:notes

      - name: Combine sites for Oracle
        run: |
          mkdir -p deploy-output/notes
          cp -R dist/. deploy-output/
          cp -R dist-notes/. deploy-output/notes/
          printf '%s\n' "$GITHUB_SHA" > deploy-output/deployment-version.txt

      - name: Publish built files to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./deploy-output
          # Connected hosting can pull successive deployments without rewritten history.
          force_orphan: false
          allow_empty_commit: true

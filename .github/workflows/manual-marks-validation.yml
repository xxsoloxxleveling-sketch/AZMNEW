name: Manual examination marks - synthetic validation

on:
  push:
    branches:
      - feature/superadmin-add-missing-manual-marks-20261116
      - feature/verified-manual-exam-marks-pr51-20261117

permissions:
  contents: read

jobs:
  validate:
    name: Frontend, backend, and isolated PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:synthetic_test_only@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:synthetic_test_only@127.0.0.1:5432/postgres
      JWT_ACCESS_SECRET: synthetic-ci-only-access
      JWT_REFRESH_SECRET: synthetic-ci-only-refresh
      QR_SECRET: synthetic-ci-only-qr
      PGPASSWORD: synthetic_test_only
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client and validate model
        working-directory: backend
        run: |
          ./node_modules/.bin/prisma generate
          ./node_modules/.bin/prisma validate
      - name: Compile backend TypeScript
        working-directory: backend
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Run manual score unit and public authorization tests
        working-directory: backend
        run: node --import tsx --test tests/manual-exam-marks.test.ts tests/manual-mark-verification.test.ts tests/public-current-omr-marks.test.ts
      - name: Synthetic PostgreSQL 17 migration and source-collision check
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          CREATE TABLE public."User" (id text PRIMARY KEY, name text NOT NULL, role text NOT NULL, status text NOT NULL);
          CREATE TABLE public."Student" (
            id text PRIMARY KEY, status text NOT NULL, "rollNumber" text,
            "applicationNo" text, "testScore" integer
          );
          CREATE TABLE public."OmrProvisionalMark" (
            "studentId" text NOT NULL, "sessionReference" text NOT NULL,
            PRIMARY KEY ("sessionReference","studentId")
          );
          CREATE TABLE public."ExaminationResult" ("studentId" text NOT NULL);
          INSERT INTO public."User" VALUES ('admin-synthetic','Synthetic Super Admin','SUPER_ADMIN','ACTIVE');
          INSERT INTO public."Student" VALUES ('candidate-synthetic','ACTIVE','AZM-01','APP-01',NULL);
          ALTER TABLE public."Student"
            ADD COLUMN "fullName" TEXT NOT NULL DEFAULT 'Synthetic Student',
            ADD COLUMN "fatherName" TEXT NOT NULL DEFAULT 'Synthetic Parent',
            ADD COLUMN "currentClass" TEXT NOT NULL DEFAULT 'Class 6';
          SQL
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f backend/prisma/migrations/20261116110000_superadmin_manual_exam_mark_entry/migration.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          SELECT * FROM public.azm_record_manual_exam_mark(
            'candidate-synthetic', 77,'SYNTHETIC-SIGNED-MARK-REGISTER-01',
            'Synthetic signed examination record checked during isolated PostgreSQL test.',
            TRUE,TRUE,'admin-synthetic'
          );
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public."ManualExamMark") <> 1 THEN
              RAISE EXCEPTION 'Manual score not inserted';
            END IF;
            IF (SELECT "obtainedMarks" FROM public."ManualExamMark") <> 77 THEN
              RAISE EXCEPTION 'Wrong manual score';
            END IF;
            BEGIN
              INSERT INTO public."OmrProvisionalMark"("studentId","sessionReference")
              VALUES ('candidate-synthetic','2026-V');
              RAISE EXCEPTION 'Omr source conflict was not rejected';
            EXCEPTION WHEN unique_violation THEN
              RAISE NOTICE 'OMR source collision correctly rejected';
            END;
            BEGIN
              PERFORM * FROM public.azm_record_manual_exam_mark(
                'candidate-synthetic', 33,'SYNTHETIC-SIGNED-MARK-REGISTER-02',
                'A synthetic attempt to replace a score must not be permitted.',
                TRUE, TRUE, 'admin-synthetic'
              );
              RAISE EXCEPTION 'Duplicate manual mark was not rejected';
            EXCEPTION WHEN unique_violation THEN
              RAISE NOTICE 'Duplicate manual entry correctly rejected';
            END;
            IF (SELECT count(*) FROM public."ManualExamMark") <> 1 THEN
              RAISE EXCEPTION 'Manual audit row was changed';
            END IF;
          END $$;
          SQL
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f backend/prisma/migrations/20261117110000_verified_manual_exam_mark_audit/migration.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          SELECT * FROM public.azm_verify_manual_exam_mark(
            'candidate-synthetic',77,'SYNTHETIC-VERIFICATION-REGISTER-01',
            'Independent synthetic review confirmed the recorded total, student identity and attendance.',
            TRUE,TRUE,TRUE,'admin-synthetic'
          );
          DO $
          BEGIN
            IF (SELECT count(*) FROM public."ManualExamMarkVerificationAudit")<>1 THEN
              RAISE EXCEPTION 'Missing manual verification audit';
            END IF;
            IF (SELECT "verifiedMarks" FROM public."ManualExamMarkVerificationAudit")<>77 THEN
              RAISE EXCEPTION 'Verification altered source score';
            END IF;
            IF (SELECT "obtainedMarks" FROM public."ManualExamMark")<>77 THEN
              RAISE EXCEPTION 'Manual original score changed';
            END IF;
            BEGIN
              PERFORM * FROM public.azm_verify_manual_exam_mark(
                'candidate-synthetic',77,'SYNTHETIC-VERIFICATION-REGISTER-02',
                'A repeated verification of the same score and identity must be rejected.',
                TRUE,TRUE,TRUE,'admin-synthetic');
              RAISE EXCEPTION 'Duplicate verification was incorrectly accepted';
            EXCEPTION WHEN invalid_parameter_value THEN
              RAISE NOTICE 'Already-verified score correctly rejected';
            END;
            BEGIN
              PERFORM * FROM public.azm_verify_manual_exam_mark(
                'candidate-synthetic',78,'SYNTHETIC-VERIFICATION-REGISTER-03',
                'A stale score must never be allowed to seal a different recorded total.',
                TRUE,TRUE,TRUE,'admin-synthetic');
              RAISE EXCEPTION 'Stale score was incorrectly accepted';
            EXCEPTION WHEN serialization_failure THEN
              RAISE NOTICE 'Stale manual score correctly rejected';
            END;
          END $;
          SQL
          echo 'All tests used synthetic records; no production connection or writes.'

name: Smart OMR isolated checks
on:
  push:
    branches: [codex/smart-omr-evaluation-mobile]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  omr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_omr_only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:synthetic_omr_only@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:synthetic_omr_only@127.0.0.1:5432/postgres
      ATTENDANCE_TEST_DATABASE_URL: postgresql://postgres:synthetic_omr_only@127.0.0.1:5432/postgres
      REQUIRE_PG17: 'true'
      JWT_ACCESS_SECRET: synthetic-ci-omr-access-secret-only
      JWT_REFRESH_SECRET: synthetic-ci-omr-refresh-secret-only
      QR_SECRET: synthetic-ci-omr-qr-secret-only
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install isolated dependencies
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm ci --prefix backend --ignore-scripts --legacy-peer-deps
          npm ci --prefix tools/omr-dev --ignore-scripts --legacy-peer-deps
          npm ci --prefix apps/omr-mobile --ignore-scripts --legacy-peer-deps
          python -m pip install -r workers/omr/requirements.txt
      - name: Use PostgreSQL 17 client tools from the disposable service
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pg17-tools"
          container=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -1)
          test -n "$container"
          for tool in psql pg_dump pg_restore; do
            printf '#!/usr/bin/env bash\nexec node "%s/tools/omr-dev/pg-client-proxy.mjs" "%s" "%s" "$@"\n' "$GITHUB_WORKSPACE" "$tool" "$container" > "$RUNNER_TEMP/pg17-tools/$tool"
            chmod +x "$RUNNER_TEMP/pg17-tools/$tool"
          done
          echo "AZM_TEST_POSTGRES_BIN=$RUNNER_TEMP/pg17-tools" >> "$GITHUB_ENV"
      - name: Validate schema and compile applications
        run: |
          cd backend
          npx prisma generate
          npx prisma validate
          npx tsc
          cd ..
          npm run build
          npm run build --prefix apps/omr-mobile
      - name: Scanner and synthetic API/security tests
        run: |
          python -m unittest discover -s workers/omr -v
          node --import ./backend/node_modules/tsx/dist/loader.mjs --test backend/tests/omr-scoring.test.ts backend/tests/omr-database.test.ts backend/tests/omr-migration-recovery.test.ts backend/tests/omr-api.test.ts backend/tests/omr-security.test.ts backend/tests/omr-public-results.test.ts backend/tests/postgres-binaries.test.ts tools/omr-dev/mobile-session.test.ts tools/omr-dev/answer-key-import.test.ts
      - name: Native PostgreSQL 17 full history, grants and concurrent claims
        run: |
          node --import ./backend/node_modules/tsx/dist/loader.mjs --test backend/tests/omr-native.test.ts
          node backend/node_modules/tsx/dist/cli.mjs backend/tests/hssc-runtime.test.ts
      - name: Synthetic full application and recovery workflow
        run: |
          cd backend
          npx puppeteer browsers install chrome
          chrome=$(node -e "(async()=>process.stdout.write(await require('puppeteer').executablePath()))()")
          cd ..
          export OMR_CHROME_PATH="$chrome"
          node --import ./backend/node_modules/tsx/dist/loader.mjs --test tools/omr-dev/integration.test.ts tools/omr-dev/queue-recovery.test.ts

      - name: Existing attendance upgrade and backup restore rehearsal
        run: node backend/node_modules/tsx/dist/cli.mjs backend/tests/attendance-reset-migration-rehearsal.test.ts

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install Android SDK platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'"
      - name: Build development APK only
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm ci --prefix apps/omr-mobile --ignore-scripts --legacy-peer-deps
          cd apps/omr-mobile
          npm run build
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-omr-development-apk
          path: apps/omr-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

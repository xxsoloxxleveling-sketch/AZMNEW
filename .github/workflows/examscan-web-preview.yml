name: ExamScan web deployment dry run (no publish)
on:
  push:
    branches:
      - 'feature/examscan-*'
    paths:
      - '.github/workflows/examscan-web-preview.yml'
      - '.github/workflows/deploy.yml'
      - 'src/components/home/HeroSection.tsx'
      - 'apps/examscan/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-web-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked site dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build existing portal
        run: npm run build
        env:
          VITE_API_URL: ''
      - name: Build existing Notes site
        run: npm run build:notes
      - name: Build installable staff ExamScan web app
        run: node apps/examscan/scripts/build.mjs
      - name: Rehearse exact deploy-output merge without publishing
        run: |
          mkdir -p deploy-output/notes deploy-output/examscan
          cp -R dist/. deploy-output/
          cp -R dist-notes/. deploy-output/notes/
          cp -R apps/examscan/dist/. deploy-output/examscan/
          test -s deploy-output/index.html
          test -s deploy-output/examscan/index.html
          test -s deploy-output/examscan/manifest.webmanifest
          test -s deploy-output/examscan/app.js
          test -s deploy-output/examscan/api.js
          test -s deploy-output/examscan/assets/icon-512.png
          grep -R -q 'hero-examscan-install-link' deploy-output/assets
          ! grep -R -q 'apiOrigin.*http:' deploy-output/examscan/config.js
          echo 'PASS: root site and /examscan/ PWA staged without touching deploy or production'

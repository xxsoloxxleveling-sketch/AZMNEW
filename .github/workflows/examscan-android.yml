name: ExamScan Android QR scanner verification and debug APK
on:
  push:
    branches:
      - 'feature/examscan-*'
    paths:
      - 'apps/examscan/**'
      - '.github/workflows/examscan-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: examscan-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-and-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/examscan
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 36 SDK via runner command-line tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Validate attendance API, signed-token parsing and Google scanner bridge
        run: npm test
      - name: Validate standalone web installation files
        run: npm run build
      - name: Prepare native Android scanner and manifest
        run: npm run android:prepare
      - name: Build Android QA APK (not production-signed)
        run: npm run android:apk
      - name: Inspect APK and compute checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload device-test APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: azm-examscan-android-qa-apk
          path: |
            apps/examscan/android/app/build/outputs/apk/debug/app-debug.apk
            apps/examscan/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

name: Session lifecycle - PostgreSQL 17 synthetic checks

on:
  push:
    branches:
      - feature/super-admin-session-lifecycle
      - feature/staged-attendance-preserve-only
  pull_request:
    branches:
      - feature/super-admin-attendance-reset
      - feature/db-runtime-role-isolation

permissions:
  contents: read

jobs:
  synthetic-postgres17:
    name: Synthetic PostgreSQL 17 and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only_not_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:synthetic_only_not_prod@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:synthetic_only_not_prod@127.0.0.1:5432/postgres
      ATTENDANCE_TEST_DATABASE_URL: postgresql://postgres:synthetic_only_not_prod@127.0.0.1:5432/postgres
      JWT_ACCESS_SECRET: synthetic-github-actions-access-secret-only
      JWT_REFRESH_SECRET: synthetic-github-actions-refresh-secret-only
      QR_SECRET: synthetic-github-actions-qr-secret-only
    steps:
      - name: Checkout feature code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies (skip unrelated browser downloads)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install backend dependencies (skip unrelated browser downloads)
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client and validate migration schema
        working-directory: backend
        run: |
          ./node_modules/.bin/prisma generate --schema prisma/schema.prisma
          ./node_modules/.bin/prisma validate --schema prisma/schema.prisma
      - name: Backend TypeScript compile check
        working-directory: backend
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Frontend Vite build
        run: npm run build
      - name: Targeted synthetic PostgreSQL 17 and UI regression suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            attendance-cancellation-integrity \
            attendance-cancellation-ui \
            attendance-reset-integrity \
            attendance-reset-security \
            attendance-reset-api; do
            echo "Running $suite on isolated synthetic fixture databases"
            node backend/node_modules/tsx/dist/cli.mjs "backend/tests/${suite}.test.ts"
          done
      - name: Final scope assurance
        run: |
          echo "Synthetic CI only: no Oracle production credentials, backups, migrations or deployments used."
